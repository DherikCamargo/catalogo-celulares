<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de Celulares</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0f17;color:#fff}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#111827,#1f2937);border:1px solid #263247;border-radius:24px;padding:28px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;color:#b6c0cf}.controls{display:grid;grid-template-columns:1fr;gap:12px;margin:22px 0}.search{display:flex;gap:10px;align-items:center;background:#131a25;border:1px solid #263247;border-radius:14px;padding:0 14px}.search input{width:100%;padding:14px 0;background:transparent;border:0;color:#fff;outline:none;font-size:16px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filter{border:1px solid #2b3649;background:#111827;color:#dbe4f0;border-radius:999px;padding:10px 14px;cursor:pointer}.filter.active{background:#fff;color:#0b0f17}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{overflow:hidden;background:#111827;border:1px solid #263247;border-radius:20px;display:flex;flex-direction:column}.photo{height:255px;background:#fff;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}.photo img{width:100%;height:100%;object-fit:contain;display:block}.photo .fallback{display:none;color:#64748b;font-weight:700;text-align:center}.content{padding:18px;display:flex;flex-direction:column;gap:11px;flex:1}.brand{font-size:12px;color:#91a4bd;text-transform:uppercase;letter-spacing:.12em}.name{font-size:20px;font-weight:800}.specs,.colors,.small{color:#b8c2d0;font-size:14px}.price{font-size:28px;font-weight:900;margin-top:auto}.pix{font-size:12px;color:#8fe8b4}.installment{background:#182233;border-radius:12px;padding:10px 12px;font-size:14px}.installment strong{font-size:17px}.btn{border:0;border-radius:12px;padding: G","256GB / 8GB RAM",["Branco"],2614.2],["Poco","Poco X8 Pro 5G","512GB / 8GB RAM",["Preto","Verde"],2786.75],["Poco","Poco X8 Pro 5G","512GB / 12GB RAM",["Preto","Branco","Verde"],2867.95],["Poco","Poco X8 Pro Max 5G","256GB / 12GB RAM",["Preto","Branco","Azul"],3273.95],["Poco","Poco X8 Pro Max 5G","512GB / 12GB RAM",["Preto","Azul","Laranja","Branco"],3497.25],["Redmi","Note 17 Pro Max 5G","512GB / 8GB RAM",["Preto","Verde","Gold"],3192.75],["Poco","Poco F8 Pro 5G","256GB / 12GB RAM",["Preto","Silver"],3395.75],["Poco","Poco F8 Pro 5G","512GB / 12GB RAM",["Preto","Silver"],3751],["Xiaomi","Mi 17T","512GB / 12GB RAM",["Preto"],3951.75],["Apple","iPhone 15","128GB",["Sob consulta"],4055.5],["Apple","iPhone 17e","256GB • eSIM",["Sob consulta"],4255.5],["Apple","iPhone 16","128GB",["Sob consulta"],5069.75],["Apple","iPhone 17 Air","256GB",["Sob consulta"],5828.75],["Apple","iPhone 17","256GB",["Sob consulta"],5930.25],["Apple","iPhone 16 Pro","128GB • eSIM",["Sob consulta"],5981],["Apple","iPhone 17 Pro","256GB • eSIM",["Sob consulta"],7452.75],["Apple","iPhone 17 Pro Max","256GB • eSIM",["Sob consulta"],7806.5],["Apple","iPhone 17 Pro","512GB • eSIM",["Sob consulta"],9023],["Apple","iPhone 17 Pro Max","512GB • eSIM",["Sob consulta"],9632],["Apple","iPhone 18 Pro","256GB • eSIM",["Sob consulta"],10338],["Apple","iPhone 18 Pro Max","256GB • eSIM",["Sob consulta"],10642.5],["Apple","iPhone 17 Pro Max","1TB • eSIM",["Sob consulta"],10545.5],["Apple","iPhone 18 Pro Max","256GB • eSIM",["Bordô"],11860.5],["Apple","iPhone 18 Pro Max","512GB • eSIM",["Sob consulta"],12063.5],["Apple","iPhone 18 Pro Max","512GB • eSIM",["Bordô"],13383],["Apple","iPhone 18 Pro Max","1TB • eSIM",["Sob consulta"],15920.5],["Apple","Apple Watch SE 2","44mm",["Sob consulta"],1670.25],["Apple","Apple Watch SE 3","40mm",["Sob consulta"],1924],["Apple","Apple Watch SE 3","44mm",["Sob consulta"],2176.25],["Apple","Apple Watch Series 11","42mm",["Sob consulta"],2631.5],["Apple","Apple Watch Series 11","46mm",["Sob consulta"],2833.75],["Apple","Apple Watch Ultra 3","49mm",["Sob consulta"],5269]];const products=raw.map((x,i)=>({id:i,brand:x[0],name:x[1],memory:x[2],colors:x[3],price:x[4],image:(x[3].length===1&&IMG[x[1]+' '+x[3][0]])||IMG[x[1]]||''})),els={search:document.getElementById('searchInput'),filters:document.getElementById('filterBox'),grid:document.getElementById('productGrid'),modal:document.getElementById('modal'),sheet:document.getElementById('sheet'),cartBar:document.getElementById('cartBar'),cartCount:document.getElementById('cartCount')};let active='Todos',cart=[];const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),totalCard=(p,n)=>p*FACTORS[n-1],variant=p=>p.memory+(p.colors.length===1&&p.colors[0]!=="Sob consulta"?` — ${p.colors[0]}`:"");function renderFilters(){const b=['Todos',...new Set(products.map(p=>p.brand))];els.filters.innerHTML=b.map(x=>`<button class="filter ${x===active?'active':''}" data-brand="${x}">${x}</button>`).join('');els.filters.querySelectorAll('button').forEach(x=>x.onclick=()=>{active=x.dataset.brand;renderFilters();renderProducts()})}function renderProducts(){const q=els.search.value.trim().toLowerCase(),list=products.filter(p=>(active==='Todos'||p.brand===active)&&(`${p.brand} ${p.name} ${p.memory} ${p.colors.join(" ")}`).toLowerCase().includes(q));els.grid.innerHTML=list.map(p=>`<article class="card"><div class="photo"><img src="${p.image}" alt="${p.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback">📱<br>${p.name}</div></div><div class="content"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="specs">💾 ${p.memory}</div><div class="colors">🎨 ${p.colors.join(' • ')}</div><div><div class="price">${money(p.price)}</div><div class="pix">no Pix</div></div><div class="installment">💳 ou <strong>12x de ${money(totalCard(p.price,12)/12)}</strong><br><span class="small">Total no cartão: ${money(totalCard(p.price,12))}</span></div><div class="actions"><button class="btn cardbtn full" onclick="showInstallments(${p.id})">Ver parcelas de 1x a 12x</button><button class="btn secondary" onclick="addToCart(${p.id})">+ Pedido</button><button class="btn primary" onclick="buyNow(${p.id})">WhatsApp</button></div></div></article>`).join('')||'<p>Nenhum aparelho encontrado.</p>'}function closeSheet(){els.modal.classList.remove('open')}function showInstallments(id){const p=products[id],rows=FACTORS.map((f,k)=>{const n=k+1,t=p.price*f;return `<div class="row"><strong>${n}x de ${money(t/n)}</strong><span class="small">Total ${money(t)}</span></div>`}).join('');els.sheet.innerHTML=`<button class="close" onclick="closeSheet()">×</button><h2>${p.name}</h2><p>💰 Pix: <strong>${money(p.price)}</strong></p><h3>💳 Cartão de crédito</h3>${rows}<p class="small">Taxas de parcelamento já incluídas.</p><button class="btn primary" style="width:100%" onclick="buyNow(${id})">Tenho interesse</button>`;els.modal.classList.add('open')}function addToCart(id){if(!cart.includes(id))cart.push(id);updateCart()}function updateCart(){els.cartBar.classList.toggle('hidden',!cart.length);els.cartCount.textContent=`${cart.length} ${cart.length===1?'item':'itens'}`}function removeFromCart(id){cart=cart.filter(x=>x!==id);updateCart();openCart()}function buyNow(id){const p=products[id],msg=`Olá! Tenho interesse no ${p.name} — ${variant(p)}. Valor no Pix: ${money(p.price)}. Gostaria de confirmar disponibilidade, cores e parcelamento.`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank')}function openCart(){const total=cart.reduce((s,id)=>s+products[id].price,0),rows=cart.map(id=>{const p=products[id];return `<div class="row"><span><strong>${p.name}</strong><br><span class="small">${variant(p)} • ${money(p.price)}</span></span><button class="remove" onclick="removeFromCart(${id})">Remover</button></div>`}).join('');els.sheet.innerHTML=`<button class="close" onclick="closeSheet()">×</button><h2>Seu pedido</h2>${rows}<p><strong>Total no Pix: ${money(total)}</strong></p><button class="btn primary" style="width:100%" onclick="sendCart()">Enviar no WhatsApp</button>`;els.modal.classList.add('open')}function sendCart(){const lines=cart.map(id=>{const p=products[id];return `• ${p.name} — ${variant(p)} — ${money(p.price)} no Pix`}).join('\n'),total=cart.reduce((s,id)=>s+products[id].price,0),msg=`Olá! Gostaria de consultar a disponibilidade destes aparelhos:\n\n${lines}\n\nTotal no Pix: ${money(total)}\n\nPode confirmar as cores e opções no cartão?`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank')}els.search.addEventListener('input',renderProducts);els.modal.addEventListener('click',e=>{if(e.target===els.modal)closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});renderFilters();renderProducts();</script></body></html>
